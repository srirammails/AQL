# AQL v0.13 Test Suite - the BRANCH "<name>" modifier is gone
# v0.11 put BRANCH "b" on a statement to read and write a branch of a namespace.
# In v0.13 (spec/AQL_SPEC_v0.13.md §5) a branch is a namespace: it is made with
# BRANCH FROM … INTO …, read and written with NAMESPACE "<branch>", merged with
# MERGE and dropped with FORGET FROM ALL NAMESPACE. Those are tested in
# 33_branch_fork_merge.yaml.
# From v0.11: all 6 tests removed (BRANCH "main", unknown branch, BRANCH needs
# NAMESPACE, LINK … BRANCH, BRANCH as a string: the modifier has no v0.13
# equivalent). Added: the modifier is refused.

suite: BRANCH_MODIFIER_REMOVED
spec_section: "v0.13"
requires: server
total_tests: 1

tests:
  - id: T30-01
    name: "the BRANCH \"b\" modifier is refused (use NAMESPACE \"<branch>\")"
    query: |
      RECALL FROM SEMANTIC WHERE key = "t30:a" NAMESPACE "t30-space" BRANCH "main"
    expect:
      success: false
