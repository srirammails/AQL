# AQL v0.13 Test Suite - §01 RECALL FROM WORKING (was SCAN)
# spec/AQL_SPEC_v0.13.md §1, §8. SCAN is gone: every read is RECALL, and WINDOW LAST
# works on anything with time (WORKING and EPISODIC here).
# From v0.5 (§5, §6, §19): SCAN → RECALL; WINDOW TOP n BY f → ORDER BY f DESC LIMIT n;
# WINDOW SINCE → a WHERE on the record time (BETWEEN); "SCAN only on WORKING" is now
# "WINDOW is valid on EPISODIC too".

suite: RECALL_WORKING
spec_section: "v0.13"
total_tests: 5

tests:
  - id: T01-01
    name: "RECALL FROM WORKING WINDOW LAST N"
    spec_ref: "v0.13 §1, §8 WINDOW LAST n"
    seed_required: [w-001, w-002]
    query: |
      RECALL FROM WORKING WINDOW LAST 10 RETURN bid_id, campaign
    expect:
      success: true
      count: 2
      contains:
        - bid_id: "w-001"
        - bid_id: "w-002"

  - id: T01-02
    name: "RECALL FROM WORKING WINDOW LAST duration"
    spec_ref: "v0.13 §8 WINDOW LAST duration"
    seed_required: [w-001, w-002]
    query: |
      RECALL FROM WORKING WINDOW LAST 30s RETURN bid_id
    expect:
      success: true
      count_gte: 0
      # Records created within last 30 seconds should be returned

  - id: T01-03
    name: "ORDER BY field DESC LIMIT 1 (was WINDOW TOP 1 BY field)"
    spec_ref: "v0.13 §8 ORDER BY / LIMIT"
    seed_required: [w-001, w-002]
    query: |
      RECALL FROM WORKING ORDER BY priority DESC LIMIT 1 RETURN bid_id, priority
    expect:
      success: true
      count: 1
      contains:
        - bid_id: "w-002"
          priority: 10

  - id: T01-04
    name: "WHERE created_at BETWEEN … AND … (was WINDOW SINCE)"
    spec_ref: "v0.13 §8 conditions BETWEEN"
    seed_required: [w-001, w-002]
    query: |
      RECALL FROM WORKING WHERE created_at BETWEEN "2000-01-01T00:00:00Z" AND "2999-01-01T00:00:00Z" RETURN bid_id
    expect:
      success: true
      count_gte: 2
      contains:
        - bid_id: "w-001"
        - bid_id: "w-002"

  - id: T01-05
    name: "WINDOW is valid on EPISODIC too (was: SCAN only on WORKING)"
    spec_ref: "v0.13 §8 WINDOW (anything with time)"
    seed_required: [e-001]
    query: |
      RECALL FROM EPISODIC WINDOW LAST 5 RETURN bid_id
    expect:
      success: true
      count_gte: 1
