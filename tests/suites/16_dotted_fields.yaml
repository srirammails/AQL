# AQL v0.13 Test Suite - §16 Dotted Field Paths
# Tests metadata.namespace and metadata.version in WHERE filter position and
# RETURN projection. spec/AQL_SPEC_v0.13.md §8.
# From v0.5 (§6): removed T16-02 (WHERE metadata.scope = "private") and
# metadata.scope from the RETURN test: the SCOPE private|shared modifier, and with
# it a record's scope label, has no v0.13 equivalent.

suite: DOTTED_FIELDS
spec_section: "v0.13"
total_tests: 3
bug_refs: [B20]

tests:
  - id: T16-01
    name: "WHERE metadata.namespace (B20)"
    spec_ref: "B20 WHERE metadata.namespace"
    seed_required: [e-001, e-002]
    query: |
      RECALL FROM EPISODIC WHERE metadata.namespace = "pubcontext-bidder" RETURN bid_id
    expect:
      success: true
      count_gte: 2
      contains:
        - bid_id: "e-001"
        - bid_id: "e-002"

  - id: T16-02
    name: "RETURN metadata.namespace (B20)"
    spec_ref: "B20 RETURN metadata.namespace"
    seed_required: [e-001]
    query: |
      RECALL FROM EPISODIC WHERE bid_id = "e-001" RETURN bid_id, metadata.namespace
    expect:
      success: true
      count: 1
      contains:
        - bid_id: "e-001"
          "metadata.namespace": "pubcontext-bidder"

  - id: T16-03
    name: "RETURN metadata.version (B20)"
    spec_ref: "B20 RETURN metadata.version"
    seed_required: [e-002]
    query: |
      RECALL FROM EPISODIC WHERE bid_id = "e-002" RETURN bid_id, metadata.version
    expect:
      success: true
      count: 1
      contains:
        - bid_id: "e-002"
          "metadata.version": 1
