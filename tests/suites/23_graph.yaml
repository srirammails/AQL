# AQL v0.13 Test Suite - graph reads, and relationships as links
# Multi-hop FOLLOW LINKS, both directions, WEIGHT (a minimum), TYPE ("a", "b"), and
# relationships as LINKs between SEMANTIC records (spec/AQL_SPEC_v0.13.md §2, §3,
# §8). Tests run in order; the first ones create the graph:
# g_a -next(1.0)- g_b -next(0.5)- g_c -next(0.5)- g_d, g_x -next(0.4)- g_b,
# g_a -knows(0.9)- g_x. Links are followed in both directions.
# From v0.8 §1-§6: LINK … TO → INTO; LOOKUP … KEY id = → RECALL … WHERE key =;
# FOLLOW / WITH LINKS ALL → no type; MIN_WEIGHT → WEIGHT; TYPE IN (…) → TYPE (…);
# INBOUND / BOTH removed (old T23-14 INBOUND removed; BOTH, DEPTH and WITH LINKS
# expectations recomputed for both directions).
# Facts (old T23-23..T23-34): STORE … FACT (subject, predicate, object) → STORE the
# records, then LINK … TYPE predicate; superseding → UNLINK + LINK; FACT MULTI →
# several LINKs of one TYPE; FACT value → a field set with UPDATE. Removed: "one
# current fact" (no fact records to count), the two FACT parse errors (now one test:
# FACT is refused). Added: INBOUND and MIN_WEIGHT refused.

suite: GRAPH
spec_section: "v0.13"
total_tests: 39

tests:
  - id: T23-01
    name: "setup: record g_a"
    query: |
      STORE INTO SEMANTIC (key = "g-a", concept = "g_a")
    expect:
      success: true

  - id: T23-02
    name: "setup: record g_b"
    query: |
      STORE INTO SEMANTIC (key = "g-b", concept = "g_b")
    expect:
      success: true

  - id: T23-03
    name: "setup: record g_c"
    query: |
      STORE INTO SEMANTIC (key = "g-c", concept = "g_c")
    expect:
      success: true

  - id: T23-04
    name: "setup: record g_d"
    query: |
      STORE INTO SEMANTIC (key = "g-d", concept = "g_d")
    expect:
      success: true

  - id: T23-05
    name: "setup: record g_x"
    query: |
      STORE INTO SEMANTIC (key = "g-x", concept = "g_x")
    expect:
      success: true

  - id: T23-06
    name: "setup: LINK g_a → g_b (next)"
    query: |
      LINK FROM SEMANTIC WHERE concept = "g_a" INTO SEMANTIC WHERE concept = "g_b" TYPE "next" WEIGHT 1.0
    expect:
      success: true
      count: 1

  - id: T23-07
    name: "setup: LINK g_b → g_c (next)"
    query: |
      LINK FROM SEMANTIC WHERE concept = "g_b" INTO SEMANTIC WHERE concept = "g_c" TYPE "next" WEIGHT 0.5
    expect:
      success: true
      count: 1

  - id: T23-08
    name: "setup: LINK g_c → g_d (next)"
    query: |
      LINK FROM SEMANTIC WHERE concept = "g_c" INTO SEMANTIC WHERE concept = "g_d" TYPE "next" WEIGHT 0.5
    expect:
      success: true
      count: 1

  - id: T23-09
    name: "setup: LINK g_x → g_b (next)"
    query: |
      LINK FROM SEMANTIC WHERE concept = "g_x" INTO SEMANTIC WHERE concept = "g_b" TYPE "next" WEIGHT 0.4
    expect:
      success: true
      count: 1

  - id: T23-10
    name: "setup: LINK g_a → g_x (knows)"
    query: |
      LINK FROM SEMANTIC WHERE concept = "g_a" INTO SEMANTIC WHERE concept = "g_x" TYPE "knows" WEIGHT 0.9
    expect:
      success: true
      count: 1

  - id: T23-11
    name: "DEPTH 1 (default): one hop"
    query: |
      RECALL FROM SEMANTIC WHERE concept = "g_a" FOLLOW LINKS TYPE "next"
    expect:
      success: true
      count: 1
      fields:
        data.records.0.data.concept: "g_b"

  - id: T23-12
    name: "DEPTH 3: every record within 3 hops, nearest first, by path weight within a hop"
    # hop 1: g_b (1.0); hop 2: g_c (0.5), g_x (0.4, reached through g_x → g_b);
    # hop 3: g_d (0.25)
    query: |
      RECALL FROM SEMANTIC WHERE concept = "g_a" FOLLOW LINKS TYPE "next" DEPTH 3
    expect:
      success: true
      count: 4
      fields:
        data.records.0.data.concept: "g_b"
        data.records.1.data.concept: "g_c"
        data.records.2.data.concept: "g_x"
        data.records.3.data.concept: "g_d"
        data.records.3.data._hop: 3
        data.records.3.data._path_weight: 0.25

  - id: T23-13
    name: "cycle-safe: g_b and g_x are each returned once"
    query: |
      RECALL FROM SEMANTIC WHERE concept = "g_a" FOLLOW LINKS DEPTH 5
    expect:
      success: true
      count: 4
      fields:
        data.records.0.data.concept: "g_b"
        data.records.1.data.concept: "g_x"
        data.records.2.data.concept: "g_c"
        data.records.3.data.concept: "g_d"

  - id: T23-14
    name: "both directions: every record linked to g_b, by link weight"
    query: |
      RECALL FROM SEMANTIC WHERE concept = "g_b" FOLLOW LINKS TYPE "next"
    expect:
      success: true
      count: 3
      fields:
        data.records.0.data.concept: "g_a"
        data.records.1.data.concept: "g_c"
        data.records.2.data.concept: "g_x"

  - id: T23-15
    name: "WEIGHT drops light links (at least 0.5)"
    query: |
      RECALL FROM SEMANTIC WHERE concept = "g_b" FOLLOW LINKS TYPE "next" WEIGHT 0.5
    expect:
      success: true
      count: 2
      fields:
        data.records.0.data.concept: "g_a"
        data.records.1.data.concept: "g_c"

  - id: T23-16
    name: "TYPE (\"a\", \"b\") picks several types"
    query: |
      RECALL FROM SEMANTIC WHERE concept = "g_a" FOLLOW LINKS TYPE ("next", "knows")
    expect:
      success: true
      count: 2
      fields:
        data.records.0.data.concept: "g_b"
        data.records.1.data.concept: "g_x"

  - id: T23-17
    name: "no type: every type"
    query: |
      RECALL FROM SEMANTIC WHERE concept = "g_a" FOLLOW LINKS
    expect:
      success: true
      count: 2
      fields:
        data.records.0.data.concept: "g_b"
        data.records.1.data.concept: "g_x"

  - id: T23-18
    name: "RECALL by key … FOLLOW LINKS returns the linked records"
    query: |
      RECALL FROM SEMANTIC WHERE key = "g-a" FOLLOW LINKS TYPE "next" DEPTH 2
    expect:
      success: true
      count: 3
      fields:
        data.records.0.data.concept: "g_b"
        data.records.1.data.concept: "g_c"
        data.records.2.data.concept: "g_x"

  - id: T23-19
    name: "WITH LINKS lists the links at either end of the record"
    query: |
      RECALL FROM SEMANTIC WHERE concept = "g_b" WITH LINKS
    expect:
      success: true
      count: 1
      links_count: 3

  - id: T23-20
    name: "WITH LINKS TYPE (…) WEIGHT"
    query: |
      RECALL FROM SEMANTIC WHERE concept = "g_a" WITH LINKS TYPE ("knows", "likes") WEIGHT 0.5
    expect:
      success: true
      count: 1
      links_count: 1
      links_contains:
        - link_type: "knows"

  - id: T23-21
    name: "TYPE IN (…) is refused (TYPE (…))"
    query: |
      RECALL FROM SEMANTIC WHERE concept = "g_a" FOLLOW LINKS TYPE IN ("next", "knows")
    expect:
      success: false

  - id: T23-22
    name: "INBOUND is refused (links are followed both ways)"
    query: |
      RECALL FROM SEMANTIC WHERE concept = "g_b" FOLLOW LINKS TYPE "next" INBOUND
    expect:
      success: false

  - id: T23-23
    name: "MIN_WEIGHT is refused (WEIGHT)"
    query: |
      RECALL FROM SEMANTIC WHERE concept = "g_b" FOLLOW LINKS TYPE "next" MIN_WEIGHT 0.5
    expect:
      success: false

  - id: T23-24
    name: "setup: record gf:ada"
    query: |
      STORE INTO SEMANTIC (key = "gf:ada", name = "Ada")
    expect:
      success: true

  - id: T23-25
    name: "setup: record gf:acme"
    query: |
      STORE INTO SEMANTIC (key = "gf:acme", name = "Acme")
    expect:
      success: true

  - id: T23-26
    name: "setup: record gf:globex"
    query: |
      STORE INTO SEMANTIC (key = "gf:globex", name = "Globex")
    expect:
      success: true

  - id: T23-27
    name: "setup: record gf:bob"
    query: |
      STORE INTO SEMANTIC (key = "gf:bob", name = "Bob")
    expect:
      success: true

  - id: T23-28
    name: "setup: record gf:cy"
    query: |
      STORE INTO SEMANTIC (key = "gf:cy", name = "Cy")
    expect:
      success: true

  - id: T23-29
    name: "Ada works at Acme: a LINK of TYPE works_at (was STORE … FACT)"
    query: |
      LINK FROM SEMANTIC WHERE key = "gf:ada" INTO SEMANTIC WHERE key = "gf:acme" TYPE "works_at" WEIGHT 0.9
    expect:
      success: true
      count: 1

  - id: T23-30
    name: "the relationship is followed as a link"
    query: |
      RECALL FROM SEMANTIC WHERE key = "gf:ada" FOLLOW LINKS TYPE "works_at"
    expect:
      success: true
      count: 1
      contains:
        - key: "gf:acme"

  - id: T23-31
    name: "a change of employer, step 1: UNLINK the old one"
    query: |
      UNLINK FROM SEMANTIC WHERE key = "gf:ada" INTO SEMANTIC WHERE key = "gf:acme" TYPE "works_at"
    expect:
      success: true
      count: 1

  - id: T23-32
    name: "a change of employer, step 2: LINK the new one (was FACT superseding)"
    query: |
      LINK FROM SEMANTIC WHERE key = "gf:ada" INTO SEMANTIC WHERE key = "gf:globex" TYPE "works_at"
    expect:
      success: true
      count: 1

  - id: T23-33
    name: "one employer now"
    query: |
      RECALL FROM SEMANTIC WHERE key = "gf:ada" FOLLOW LINKS TYPE "works_at"
    expect:
      success: true
      count: 1
      contains:
        - key: "gf:globex"

  - id: T23-34
    name: "several objects: LINK knows Bob (was FACT MULTI)"
    query: |
      LINK FROM SEMANTIC WHERE key = "gf:ada" INTO SEMANTIC WHERE key = "gf:bob" TYPE "knows"
    expect:
      success: true
      count: 1

  - id: T23-35
    name: "several objects: LINK knows Cy"
    query: |
      LINK FROM SEMANTIC WHERE key = "gf:ada" INTO SEMANTIC WHERE key = "gf:cy" TYPE "knows"
    expect:
      success: true
      count: 1

  - id: T23-36
    name: "both are followed"
    query: |
      RECALL FROM SEMANTIC WHERE key = "gf:ada" FOLLOW LINKS TYPE "knows"
    expect:
      success: true
      count: 2

  - id: T23-37
    name: "a value is a field (was FACT … value =)"
    query: |
      UPDATE INTO SEMANTIC WHERE key = "gf:ada" (born = 1815)
    expect:
      success: true
      count: 1

  - id: T23-38
    name: "the field is on the record; it is not a link"
    query: |
      RECALL FROM SEMANTIC WHERE key = "gf:ada" WITH LINKS
    expect:
      success: true
      count: 1
      contains:
        - born: 1815
      links_count: 3

  - id: T23-39
    name: "STORE … FACT is refused"
    query: |
      STORE INTO SEMANTIC FACT (subject = "gf:ada", predicate = "works_at", object = "gf:acme")
    expect:
      success: false
