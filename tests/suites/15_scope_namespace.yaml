# AQL v0.13 Test Suite - §15 NAMESPACE
# NAMESPACE isolation: a read names whose memory it touches; another namespace's
# records are not returned. spec/AQL_SPEC_v0.13.md (intro), §8.
# From v0.5 (§14): removed T15-01 / T15-02 (SCOPE private / SCOPE shared isolation):
# the SCOPE private|shared|cluster modifier has no v0.13 equivalent (IN SCOPE is
# suite 20). T15-05 drops SCOPE private and keeps NAMESPACE.

suite: NAMESPACE
spec_section: "v0.13"
total_tests: 3
bug_refs: [B11]

tests:
  - id: T15-01
    name: "NAMESPACE wrong (B11)"
    spec_ref: "B11 NAMESPACE wrong"
    seed_required: [e-003]
    # e-003 is in namespace "agent-b-ns"
    query: |
      RECALL FROM EPISODIC WHERE campaign = "winter_2026" NAMESPACE "pubcontext-bidder" RETURN bid_id
    expect:
      success: true
      count: 0

  - id: T15-02
    name: "NAMESPACE correct (B11)"
    spec_ref: "B11 NAMESPACE correct"
    seed_required: [e-003]
    query: |
      RECALL FROM EPISODIC WHERE campaign = "winter_2026" NAMESPACE "agent-b-ns" RETURN bid_id
    expect:
      success: true
      count: 1
      contains:
        - bid_id: "e-003"

  - id: T15-03
    name: "NAMESPACE returns that namespace's records"
    spec_ref: "v0.13 §8 NAMESPACE"
    seed_required: [e-001, e-002]
    query: |
      RECALL FROM EPISODIC WHERE campaign = "summer_2026" NAMESPACE "pubcontext-bidder" RETURN bid_id
    expect:
      success: true
      count: 2
      contains:
        - bid_id: "e-001"
        - bid_id: "e-002"
