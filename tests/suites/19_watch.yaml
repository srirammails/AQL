# AQL v0.13 Test Suite - Live queries (SUBSCRIBE RECALL … / UNSUBSCRIBE)
# spec/AQL_SPEC_v0.13.md §7: a subscription to a RECALL is a live query, its result
# as it changes. The registration answer is the snapshot {cq_id, offset, result};
# diffs go over the engine's transports (SSE / MCP).
# From v0.6 §3: WATCH <read> → SUBSCRIBE RECALL …; WATCH LOOKUP … KEY id = →
# SUBSCRIBE RECALL … WHERE key =; WATCH SCAN → SUBSCRIBE RECALL FROM WORKING;
# ALL predicate dropped; UNWATCH → UNSUBSCRIBE (data.unsubscribed). Removed, no
# v0.13 equivalent in AQL (how often a live query re-runs is a server setting):
# DEBOUNCE and FROM NOW (old T19-08, T19-09 tested the DEBOUNCE range).

suite: LIVE_QUERIES
spec_section: "v0.13"
requires: server
total_tests: 11

tests:
  - id: T19-01
    name: "setup: a scoped record"
    query: |
      STORE INTO SEMANTIC (key = "cw-1", topic = "cw", n = 1) IN SCOPE "team:conf-watch"
    expect:
      success: true

  - id: T19-02
    name: "setup: a second scoped record"
    query: |
      STORE INTO SEMANTIC (key = "cw-2", topic = "cw", n = 2) IN SCOPE "team:conf-watch"
    expect:
      success: true

  - id: T19-03
    name: "SUBSCRIBE RECALL returns the snapshot"
    query: |
      SUBSCRIBE RECALL FROM SEMANTIC IN SCOPE "team:conf-watch"
    expect:
      success: true
      fields:
        data.type: "snapshot"
        data.result.data.count: 2
      fields_exist: [data.cq_id, data.offset]
    capture:
      cq: data.cq_id

  - id: T19-04
    name: "SUBSCRIBE RECALL by key"
    query: |
      SUBSCRIBE RECALL FROM SEMANTIC IN SCOPE "team:conf-watch" WHERE key = "cw-1"
    expect:
      success: true
      fields:
        data.type: "snapshot"
        data.result.data.count: 1

  - id: T19-05
    name: "SUBSCRIBE RECALL with ORDER BY and LIMIT"
    query: |
      SUBSCRIBE RECALL FROM SEMANTIC IN SCOPE "team:conf-watch" WHERE topic = "cw" ORDER BY n DESC LIMIT 1
    expect:
      success: true
      fields:
        data.result.data.count: 1
        data.result.data.records.0.id: "team:conf-watch~cw-2"

  - id: T19-06
    name: "SUBSCRIBE to an aggregate"
    query: |
      SUBSCRIBE RECALL FROM SEMANTIC IN SCOPE "team:conf-watch" AGGREGATE COUNT(*) AS c
    expect:
      success: true
      fields:
        data.result.data.values.c: 2

  - id: T19-07
    name: "SUBSCRIBE RECALL FROM WORKING WINDOW (was WATCH SCAN)"
    query: |
      SUBSCRIBE RECALL FROM WORKING WINDOW LAST 10
    expect:
      success: true
      fields:
        data.type: "snapshot"

  - id: T19-08
    name: "only reads are live queries: a write is a parse error"
    query: |
      SUBSCRIBE STORE INTO SEMANTIC (a = 1)
    expect:
      success: false
      error_contains: "parse"

  - id: T19-09
    name: "a PIPELINE can't be subscribed to"
    query: |
      SUBSCRIBE PIPELINE p TIMEOUT 100ms RECALL FROM SEMANTIC
    expect:
      success: false

  - id: T19-10
    name: "UNSUBSCRIBE stops the live query"
    query: |
      UNSUBSCRIBE "${cq}"
    expect:
      success: true
      fields:
        data.unsubscribed: true

  - id: T19-11
    name: "UNSUBSCRIBE again: nothing to stop"
    query: |
      UNSUBSCRIBE "${cq}"
    expect:
      success: true
      fields:
        data.unsubscribed: false
