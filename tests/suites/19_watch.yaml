# AQL v0.6 Test Suite - Continuous queries (WATCH / UNWATCH)
# spec/AQL_SPEC_v0.6_additions.md §3. The registration answer is the snapshot
# {cq_id, offset, result}; diffs go over the engine's transports (SSE / MCP).

suite: WATCH
spec_section: "v0.6 §3"
requires: server
total_tests: 13

tests:
  - id: T19-01
    name: "setup: a scoped fact"
    query: |
      STORE INTO SEMANTIC (key = "cw-1", topic = "cw", n = 1) IN SCOPE "team:conf-watch"
    expect:
      success: true

  - id: T19-02
    name: "setup: a second scoped fact"
    query: |
      STORE INTO SEMANTIC (key = "cw-2", topic = "cw", n = 2) IN SCOPE "team:conf-watch"
    expect:
      success: true

  - id: T19-03
    name: "WATCH RECALL returns the snapshot"
    query: |
      WATCH RECALL FROM SEMANTIC IN SCOPE "team:conf-watch" ALL DEBOUNCE 100ms FROM NOW
    expect:
      success: true
      fields:
        data.type: "snapshot"
        data.result.data.count: 2
      fields_exist: [data.cq_id, data.offset]
    capture:
      cq: data.cq_id

  - id: T19-04
    name: "WATCH LOOKUP by key"
    query: |
      WATCH LOOKUP FROM SEMANTIC IN SCOPE "team:conf-watch" KEY id = "cw-1"
    expect:
      success: true
      fields:
        data.type: "snapshot"
        data.result.data.count: 1

  - id: T19-05
    name: "WATCH with ORDER BY and LIMIT"
    query: |
      WATCH RECALL FROM SEMANTIC IN SCOPE "team:conf-watch" WHERE topic = "cw" ORDER BY n DESC LIMIT 1
    expect:
      success: true
      fields:
        data.result.data.count: 1
        data.result.data.records.0.id: "cw-2"

  - id: T19-06
    name: "WATCH an aggregate"
    query: |
      WATCH RECALL FROM SEMANTIC IN SCOPE "team:conf-watch" ALL AGGREGATE COUNT(*) AS c
    expect:
      success: true
      fields:
        data.result.data.values.c: 2

  - id: T19-07
    name: "WATCH SCAN"
    query: |
      WATCH SCAN FROM WORKING WINDOW LAST 10
    expect:
      success: true
      fields:
        data.type: "snapshot"

  - id: T19-08
    name: "DEBOUNCE below 50ms is refused"
    query: |
      WATCH RECALL FROM SEMANTIC ALL DEBOUNCE 5ms
    expect:
      success: false
      error_contains: "DEBOUNCE"

  - id: T19-09
    name: "DEBOUNCE above 500ms is refused"
    query: |
      WATCH RECALL FROM SEMANTIC ALL DEBOUNCE 600ms
    expect:
      success: false
      error_contains: "DEBOUNCE"

  - id: T19-10
    name: "only reads can be watched: a write is a parse error"
    query: |
      WATCH STORE INTO SEMANTIC (a = 1)
    expect:
      success: false
      error_contains: "parse"

  - id: T19-11
    name: "PIPELINE can't be watched"
    query: |
      WATCH PIPELINE p TIMEOUT 100ms RECALL FROM SEMANTIC ALL
    expect:
      success: false

  - id: T19-12
    name: "UNWATCH stops the watch"
    query: |
      UNWATCH "${cq}"
    expect:
      success: true
      fields:
        data.unwatched: true

  - id: T19-13
    name: "UNWATCH again: nothing to stop"
    query: |
      UNWATCH "${cq}"
    expect:
      success: true
      fields:
        data.unwatched: false
