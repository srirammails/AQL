# AQL v0.13 Test Suite - §03 RECALL by key (was LOOKUP)
# spec/AQL_SPEC_v0.13.md §1. LOOKUP is gone: RECALL … WHERE x = v is the exact read,
# on every memory type.
# From v0.5 (§5, §19): LOOKUP → RECALL; KEY x = v → WHERE x = v. "LOOKUP invalid on
# WORKING" is now a valid read on WORKING; "LOOKUP invalid on EPISODIC" was removed
# (the same read is T02-01).

suite: RECALL_KEY
spec_section: "v0.13"
total_tests: 4

tests:
  - id: T03-01
    name: "RECALL SEMANTIC WHERE concept = (was LOOKUP KEY)"
    spec_ref: "v0.13 §1 exact read"
    seed_required: [semantic-ai]
    query: |
      RECALL FROM SEMANTIC WHERE concept = "ai_enterprise_content" RETURN concept, avg_cpm, iab_category
    expect:
      success: true
      count: 1
      contains:
        - concept: "ai_enterprise_content"
          avg_cpm: 3.40
          iab_category: "IAB19"

  - id: T03-02
    name: "RECALL SEMANTIC WHERE comparison"
    spec_ref: "v0.13 §1 filtered read"
    seed_required: [semantic-ai, semantic-finance]
    query: |
      RECALL FROM SEMANTIC WHERE avg_cpm > 3 RETURN concept, avg_cpm
    expect:
      success: true
      count: 2
      contains:
        - concept: "ai_enterprise_content"
        - concept: "finance_news"

  - id: T03-03
    name: "RECALL PROCEDURAL WHERE"
    spec_ref: "v0.13 §1 PROCEDURAL"
    seed_required: [$PROC_ID]
    query: |
      RECALL FROM PROCEDURAL WHERE pattern = "tech_news_premium" RETURN pattern, confidence, steps
    expect:
      success: true
      count: 1
      contains:
        - pattern: "tech_news_premium"

  - id: T03-04
    name: "an exact read on WORKING (was: LOOKUP invalid on WORKING)"
    spec_ref: "v0.13 §1 every memory type"
    seed_required: [w-001]
    query: |
      RECALL FROM WORKING WHERE bid_id = "w-001" RETURN bid_id
    expect:
      success: true
      count: 1
      contains:
        - bid_id: "w-001"
