# AQL v0.13 Test Suite - Subscriptions (SUBSCRIBE TOPIC / PUBLISH / UNSUBSCRIBE)
# spec/AQL_SPEC_v0.13.md §7. Statement-level behaviour only: deliveries go over the
# engine's transports (SSE / MCP), which the engine's own tests cover. A
# subscription starts now. Tests run in order; ${sub} is captured from T18-01.
# From v0.6 §2: FROM NOW / FROM OFFSET dropped from SUBSCRIBE (start_offset is no
# longer expected). Removed, no v0.13 equivalent in AQL (acknowledgements, resuming
# and record kinds are the server's API): ACK (old T18-03, T18-04, T18-13),
# SUBSCRIBE SCOPE "…" KINDS … (old T18-06), KINDS parse error (old T18-08).

suite: SUBSCRIPTIONS
spec_section: "v0.13"
requires: server
total_tests: 9

tests:
  - id: T18-01
    name: "SUBSCRIBE TOPIC returns a handle"
    query: |
      SUBSCRIBE TOPIC "conf.orders"
    expect:
      success: true
      fields:
        data.type: "subscription"
      fields_exist: [data.subscription]
    capture:
      sub: data.subscription

  - id: T18-02
    name: "PUBLISH writes an event and returns its offset"
    query: |
      PUBLISH TOPIC "conf.orders" (order_id = "o-1", status = "paid") TTL 7d
    expect:
      success: true
      fields:
        data.topic: "conf.orders"
      fields_exist: [data.id, data.offset]

  - id: T18-03
    name: "SUBSCRIBE TOPIC with WHERE"
    query: |
      SUBSCRIBE TOPIC "conf.orders" WHERE status = "paid"
    expect:
      success: true
      fields:
        data.type: "subscription"
      fields_exist: [data.subscription]

  - id: T18-04
    name: "SUBSCRIBE to a second topic"
    query: |
      SUBSCRIBE TOPIC "conf.other"
    expect:
      success: true
      fields_exist: [data.subscription]

  - id: T18-05
    name: "PUBLISH needs a payload"
    query: |
      PUBLISH TOPIC "conf.orders"
    expect:
      success: false
      error_contains: "parse"

  - id: T18-06
    name: "PUBLISH to a second topic"
    query: |
      PUBLISH TOPIC "conf.other" (n = 1)
    expect:
      success: true
      fields:
        data.topic: "conf.other"

  - id: T18-07
    name: "UNSUBSCRIBE stops the subscription"
    query: |
      UNSUBSCRIBE "${sub}"
    expect:
      success: true
      fields:
        data.unsubscribed: true

  - id: T18-08
    name: "UNSUBSCRIBE again: nothing to stop"
    query: |
      UNSUBSCRIBE "${sub}"
    expect:
      success: true
      fields:
        data.unsubscribed: false

  - id: T18-09
    name: "keywords are case-insensitive"
    query: |
      subscribe topic "conf.orders"
    expect:
      success: true
      fields_exist: [data.subscription]
