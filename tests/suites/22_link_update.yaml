# AQL v0.13 Test Suite - §22 LINK (create or update) / UNLINK
# spec/AQL_SPEC_v0.13.md §3: LINK on a link that exists sets its weight; UNLINK with
# or without TYPE; links are read in both directions; WITH LINKS … WEIGHT is a
# minimum. Tests run in order; the first ones create their records.
# From v0.7 §1-§3: LINK … TO → INTO; WITH LINKS ALL → WITH LINKS; UPDATE LINK … WEIGHT
# → LINK … WEIGHT; UPDATE LINK (type = …) → UNLINK the old TYPE + LINK the new one;
# UPDATE LINK on missing records → LINK on missing records fails ("source").
# Removed: UPDATE LINK with no matching link (LINK now creates it), UPDATE LINK with
# other fields (no such form), UPDATE LINK FROM ALL (LINK FROM ALL is T08-06).
# Added: WITH LINKS WEIGHT minimum (T22-23), the link seen from its other end (T22-24).

suite: LINK_UPDATE
spec_section: "v0.13"
total_tests: 24

tests:
  - id: T22-01
    name: "setup: record a"
    query: |
      STORE INTO SEMANTIC (key = "lu-a", concept = "lu_a")
    expect:
      success: true

  - id: T22-02
    name: "setup: record b"
    query: |
      STORE INTO SEMANTIC (key = "lu-b", concept = "lu_b")
    expect:
      success: true

  - id: T22-03
    name: "LINK a → b"
    query: |
      LINK FROM SEMANTIC WHERE concept = "lu_a" INTO SEMANTIC WHERE concept = "lu_b" TYPE "related" WEIGHT 0.5
    expect:
      success: true
      count: 1

  - id: T22-04
    name: "LINK again, same type: updates the weight"
    query: |
      LINK FROM SEMANTIC WHERE concept = "lu_a" INTO SEMANTIC WHERE concept = "lu_b" TYPE "related" WEIGHT 0.7
    expect:
      success: true
      count: 1

  - id: T22-05
    name: "one link, weight 0.7"
    query: |
      RECALL FROM SEMANTIC WHERE concept = "lu_a" WITH LINKS
    expect:
      success: true
      count: 1
      links_count: 1
      links_contains:
        - link_type: "related"
          weight: 0.7

  - id: T22-06
    name: "LINK … WEIGHT sets the weight (was UPDATE LINK … WEIGHT)"
    query: |
      LINK FROM SEMANTIC WHERE concept = "lu_a" INTO SEMANTIC WHERE concept = "lu_b" TYPE "related" WEIGHT 0.9
    expect:
      success: true
      count: 1

  - id: T22-07
    name: "the weight changed"
    query: |
      RECALL FROM SEMANTIC WHERE concept = "lu_a" WITH LINKS
    expect:
      success: true
      links_count: 1
      links_contains:
        - link_type: "related"
          weight: 0.9

  - id: T22-08
    name: "retype, step 1: UNLINK the old type"
    query: |
      UNLINK FROM SEMANTIC WHERE concept = "lu_a" INTO SEMANTIC WHERE concept = "lu_b" TYPE "related"
    expect:
      success: true
      count: 1

  - id: T22-09
    name: "retype, step 2: LINK the new type (was UPDATE LINK (type = …, weight = …))"
    query: |
      LINK FROM SEMANTIC WHERE concept = "lu_a" INTO SEMANTIC WHERE concept = "lu_b" TYPE "depends_on" WEIGHT 0.4
    expect:
      success: true
      count: 1

  - id: T22-10
    name: "FOLLOW LINKS the new type reaches b"
    query: |
      RECALL FROM SEMANTIC WHERE concept = "lu_a" FOLLOW LINKS TYPE "depends_on"
    expect:
      success: true
      count: 1
      contains:
        - concept: "lu_b"

  - id: T22-11
    name: "the old type is gone"
    query: |
      RECALL FROM SEMANTIC WHERE concept = "lu_a" WITH LINKS TYPE "related"
    expect:
      success: true
      links_count: 0

  - id: T22-12
    name: "LINK with no matching source record fails"
    query: |
      LINK FROM SEMANTIC WHERE concept = "ghost" INTO SEMANTIC WHERE concept = "lu_b" TYPE "related" WEIGHT 0.1
    expect:
      success: false
      error_contains: "source"

  - id: T22-13
    name: "a second link type between the same records"
    query: |
      LINK FROM SEMANTIC WHERE concept = "lu_a" INTO SEMANTIC WHERE concept = "lu_b" TYPE "mentions" WEIGHT 0.2
    expect:
      success: true
      count: 1

  - id: T22-14
    name: "UNLINK … TYPE removes only that type"
    query: |
      UNLINK FROM SEMANTIC WHERE concept = "lu_a" INTO SEMANTIC WHERE concept = "lu_b" TYPE "mentions"
    expect:
      success: true
      count: 1

  - id: T22-15
    name: "the other link stays"
    query: |
      RECALL FROM SEMANTIC WHERE concept = "lu_a" WITH LINKS
    expect:
      success: true
      links_count: 1
      links_contains:
        - link_type: "depends_on"

  - id: T22-16
    name: "UNLINK without TYPE removes every link between them"
    query: |
      UNLINK FROM SEMANTIC WHERE concept = "lu_a" INTO SEMANTIC WHERE concept = "lu_b"
    expect:
      success: true
      count: 1

  - id: T22-17
    name: "no links left; the records stay"
    query: |
      RECALL FROM SEMANTIC WHERE concept = "lu_a" WITH LINKS
    expect:
      success: true
      count: 1
      links_count: 0

  - id: T22-18
    name: "UNLINK again is a no-op"
    query: |
      UNLINK FROM SEMANTIC WHERE concept = "lu_a" INTO SEMANTIC WHERE concept = "lu_b"
    expect:
      success: true
      count: 0

  - id: T22-19
    name: "setup: record c"
    query: |
      STORE INTO SEMANTIC (key = "lu-c", concept = "lu_c")
    expect:
      success: true

  - id: T22-20
    name: "LINK a → c, weight 0.3"
    query: |
      LINK FROM SEMANTIC WHERE concept = "lu_a" INTO SEMANTIC WHERE concept = "lu_c" TYPE "cites" WEIGHT 0.3
    expect:
      success: true
      count: 1

  - id: T22-21
    name: "LINK again without WEIGHT keeps the weight"
    query: |
      LINK FROM SEMANTIC WHERE concept = "lu_a" INTO SEMANTIC WHERE concept = "lu_c" TYPE "cites"
    expect:
      success: true
      count: 1

  - id: T22-22
    name: "still one link, weight 0.3"
    query: |
      RECALL FROM SEMANTIC WHERE concept = "lu_a" WITH LINKS
    expect:
      success: true
      links_count: 1
      links_contains:
        - link_type: "cites"
          weight: 0.3

  - id: T22-23
    name: "WITH LINKS WEIGHT is a minimum: 0.3 < 0.5"
    query: |
      RECALL FROM SEMANTIC WHERE concept = "lu_a" WITH LINKS WEIGHT 0.5
    expect:
      success: true
      count: 1
      links_count: 0

  - id: T22-24
    name: "the link is read from its other end too (both directions)"
    query: |
      RECALL FROM SEMANTIC WHERE concept = "lu_c" WITH LINKS
    expect:
      success: true
      count: 1
      links_count: 1
      links_contains:
        - link_type: "cites"
