# AQL v0.13 Test Suite - §04 RECALL FROM TOOLS (was LOAD)
# spec/AQL_SPEC_v0.13.md §1: tools ranked for the task.
# From v0.5 (§5, §19): LOAD FROM TOOLS → RECALL FROM TOOLS. "LOAD invalid on
# EPISODIC" was removed (RECALL reads every type); added a read by task.

suite: RECALL_TOOLS
spec_section: "v0.13"
total_tests: 2

tests:
  - id: T04-01
    name: "RECALL TOOLS ranking (was LOAD)"
    spec_ref: "v0.13 §1 TOOLS"
    seed_required: [ctx_scorer_v2]
    query: |
      RECALL FROM TOOLS WHERE ranking > 0.5 ORDER BY ranking DESC RETURN tool_id, name, ranking, schema
    expect:
      success: true
      count: 1
      contains:
        - tool_id: "ctx_scorer_v2"
          ranking: 0.92
          schema: "context_score_v2"

  - id: T04-02
    name: "RECALL TOOLS WHERE task = … LIMIT n"
    spec_ref: "v0.13 §1 tools ranked for the task"
    seed_required: [ctx_scorer_v2]
    query: |
      RECALL FROM TOOLS WHERE task = "scoring" LIMIT 3 RETURN tool_id, task
    expect:
      success: true
      count: 1
      contains:
        - tool_id: "ctx_scorer_v2"
