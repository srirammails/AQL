# AQL v0.13 Test Suite - §11 multi-source reads and writes (was REFLECT)
# spec/AQL_SPEC_v0.13.md §1, §6. REFLECT is gone: a multi-source read is a PIPELINE
# of RECALLs (or RECALL FROM ALL), and REFLECT … THEN is a PIPELINE whose last stage
# is a STORE or UPDATE.
# From v0.5 (§11): REFLECT FROM a, FROM b → PIPELINE … RECALL a | RECALL b;
# REFLECT FROM ALL → RECALL FROM ALL; THEN STORE → last stage STORE; REFLECT as a
# PIPELINE stage → a PIPELINE ending in UPDATE.

suite: PIPELINE_REFLECT
spec_section: "v0.13"
total_tests: 4
bug_refs: [B2, B8, B9]

tests:
  - id: T11-01
    name: "multi-source read as a PIPELINE of RECALLs"
    spec_ref: "v0.13 §6 PIPELINE"
    seed_required: [e-001, semantic-ai, w-001]
    query: |
      PIPELINE reflect_multi TIMEOUT 100ms RECALL FROM EPISODIC WHERE campaign = "summer_2026" | RECALL FROM SEMANTIC WHERE concept = "ai_enterprise_content" | RECALL FROM WORKING WHERE bid_id = "w-001"
    expect:
      success: true
      steps: 3
      step_1:
        count_gte: 1
      step_2:
        count_gte: 1
      step_3:
        count_gte: 1

  - id: T11-02
    name: "RECALL FROM ALL (B2, was REFLECT FROM ALL)"
    spec_ref: "B2 v0.13 §1 RECALL FROM ALL"
    seed_required: [w-001, w-002, e-001, e-002]
    query: |
      RECALL FROM ALL WHERE campaign = "summer_2026" RETURN bid_id, campaign
    expect:
      success: true
      count_gte: 4
      contains:
        - bid_id: "w-001"
        - bid_id: "w-002"
        - bid_id: "e-001"
        - bid_id: "e-002"

  - id: T11-03
    name: "PIPELINE with a STORE last (B8, was REFLECT THEN STORE)"
    spec_ref: "B8 v0.13 §6 write last"
    seed_required: [e-001, e-002]
    query: |
      PIPELINE summer_insight TIMEOUT 100ms RECALL FROM EPISODIC WHERE campaign = "summer_2026" | STORE INTO SEMANTIC (concept = "summer_insight", confidence = 0.80)
    expect:
      success: true
      steps: 2
    verify: |
      RECALL FROM SEMANTIC WHERE concept = "summer_insight" RETURN concept, confidence
    verify_expect:
      count: 1
      contains:
        - concept: "summer_insight"
          confidence: 0.80

  - id: T11-04
    name: "PIPELINE of reads with an UPDATE last (B9, was REFLECT in PIPELINE)"
    spec_ref: "B9 v0.13 §6 write last"
    seed_required: [e-001, semantic-ai]
    query: |
      PIPELINE ctx TIMEOUT 100ms RECALL FROM EPISODIC WHERE campaign = "summer_2026" RETURN bid_id | RECALL FROM SEMANTIC WHERE concept = "ai_enterprise_content" | UPDATE INTO SEMANTIC WHERE concept = "summer_insight" (sources = 2)
    expect:
      success: true
      steps: 3
    verify: |
      RECALL FROM SEMANTIC WHERE concept = "summer_insight" RETURN concept, sources
    verify_expect:
      count: 1
      contains:
        - sources: 2
