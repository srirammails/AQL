# AQL v0.13 Test Suite - §17 Validation
# Statements v0.13 refuses: writes and links on ALL, PIPELINE without TIMEOUT, and
# the v0.5-v0.12 forms that v0.13 replaced (spec/AQL_SPEC_v0.13.md §9). The refused
# old forms only check success: false (the error text is the parser's).
# From v0.5 (§19): the SCAN / LOAD / LOOKUP type restrictions became "the verb is
# gone" (T17-01..T17-03); KEY x = v is refused (T17-04); "FORGET predicate required"
# was removed (WHERE is optional on FORGET in v0.13). Added T17-08..T17-12: LINK … TO,
# PATTERN … THRESHOLD, the SCOPE modifier, WATCH and REFLECT are refused.

suite: VALIDATION
spec_section: "v0.13"
total_tests: 13

tests:
  - id: T17-01
    name: "SCAN is not a v0.13 verb"
    spec_ref: "v0.13 §9 LOOKUP, LOAD, SCAN → RECALL"
    seed_required: []
    query: |
      SCAN FROM WORKING WINDOW LAST 10 RETURN bid_id
    expect:
      success: false

  - id: T17-02
    name: "LOAD is not a v0.13 verb"
    spec_ref: "v0.13 §9 LOOKUP, LOAD, SCAN → RECALL"
    seed_required: []
    query: |
      LOAD FROM TOOLS WHERE ranking > 0.5 RETURN tool_id
    expect:
      success: false

  - id: T17-03
    name: "LOOKUP is not a v0.13 verb"
    spec_ref: "v0.13 §9 LOOKUP, LOAD, SCAN → RECALL"
    seed_required: []
    query: |
      LOOKUP FROM SEMANTIC WHERE concept = "ai_enterprise_content" RETURN concept
    expect:
      success: false

  - id: T17-04
    name: "KEY x = v is refused (WHERE x = v)"
    spec_ref: "v0.13 §9 KEY x = v → WHERE x = v"
    seed_required: []
    query: |
      RECALL FROM SEMANTIC KEY concept = "ai_enterprise_content"
    expect:
      success: false

  - id: T17-05
    name: "STORE INTO ALL invalid"
    spec_ref: "v0.13 §2 ALL is for reads and FORGET"
    seed_required: []
    query: |
      STORE INTO ALL (test = "x")
    expect:
      success: false
      error_contains: "ALL"

  - id: T17-06
    name: "LINK FROM ALL invalid"
    spec_ref: "v0.13 §3 ALL is for reads and FORGET"
    seed_required: []
    query: |
      LINK FROM ALL WHERE concept = "x" INTO PROCEDURAL WHERE pattern = "y" TYPE "t"
    expect:
      success: false
      error_contains: "ALL"

  - id: T17-07
    name: "PIPELINE without TIMEOUT runs (TIMEOUT is optional, v0.13)"
    spec_ref: "v0.13 §6 TIMEOUT optional"
    seed_required: []
    query: |
      PIPELINE p RECALL FROM EPISODIC WHERE campaign = "x" RETURN bid_id
    expect:
      success: true

  - id: T17-08
    name: "LINK … TO … is refused (LINK … INTO …)"
    spec_ref: "v0.13 §9 LINK … TO → INTO"
    seed_required: []
    query: |
      LINK FROM SEMANTIC WHERE concept = "x" TO PROCEDURAL WHERE pattern = "y" TYPE "t"
    expect:
      success: false

  - id: T17-09
    name: "PATTERN … THRESHOLD is refused (LIKE … CONFIDENCE)"
    spec_ref: "v0.13 §9 PATTERN … THRESHOLD → LIKE … CONFIDENCE"
    seed_required: []
    query: |
      RECALL FROM PROCEDURAL PATTERN "pod OOMKilled restart" THRESHOLD 0.7
    expect:
      success: false

  - id: T17-10
    name: "the SCOPE private modifier is refused"
    spec_ref: "v0.13 §9 SCOPE private|shared|cluster removed"
    seed_required: []
    query: |
      RECALL FROM EPISODIC WHERE campaign = "summer_2026" SCOPE private
    expect:
      success: false

  - id: T17-11
    name: "WATCH is refused (SUBSCRIBE RECALL …)"
    spec_ref: "v0.13 §9 WATCH → SUBSCRIBE"
    seed_required: []
    query: |
      WATCH RECALL FROM SEMANTIC WHERE active = true
    expect:
      success: false

  - id: T17-12
    name: "REFLECT is refused (PIPELINE)"
    spec_ref: "v0.13 §9 REFLECT → PIPELINE"
    seed_required: []
    query: |
      REFLECT FROM EPISODIC WHERE campaign = "summer_2026"
    expect:
      success: false

  - id: T17-13
    name: "FORGET without WHERE must name its NAMESPACE"
    spec_ref: "v0.13 §2 FORGET FROM ALL NAMESPACE"
    seed_required: []
    query: |
      FORGET FROM ALL
    expect:
      success: false
      error_contains: "NAMESPACE"
